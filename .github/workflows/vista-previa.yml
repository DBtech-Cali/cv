# Vista previa en GitHub Pages, en modo demostración (datos de ejemplo, sin Firebase).
# Se publica en la rama gh-pages cada vez que cambia la rama de trabajo.
name: Vista previa

on:
  push:
    branches: [claude/confident-carson-74nn9e]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vista-previa
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      # El modo "demo" no lee .env.production: la app arranca con datos de ejemplo.
      - run: npx vite build --mode demo
      - name: Publicar en gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Vista previa de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
